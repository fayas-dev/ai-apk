name: Build Jarvis Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: Mobile_App
        run: flutter pub get

      - name: Generate App Icons (if logo exists)
        working-directory: Mobile_App
        run: |
          if [ -f "images/logo.png" ]; then
            flutter pub run flutter_launcher_icons:main || true
          fi

      - name: Build Android Release APK
        working-directory: Mobile_App
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --dart-define=FLUTTER_WEB_USE_SKIA=true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Release-APK
          path: Mobile_App/build/outputs/flutter-apk/app-release.apk
          retention-days: 30
