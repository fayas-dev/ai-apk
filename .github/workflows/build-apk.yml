name: Build JARVIS releases

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Get Flutter dependencies
      working-directory: Mobile_App
      run: flutter pub get
    
    - name: Build APK
      working-directory: Mobile_App
      run: flutter build apk --release --no-tree-shake-icons
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-release-apk
        path: Mobile_App/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
    

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install desktop dependencies
      working-directory: PC_App
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Build desktop app
      working-directory: PC_App
      run: python build_exe.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-windows-exe
        path: PC_App/dist/Jarvis.exe
        retention-days: 30

  release:
    name: Publish release files
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: jarvis-release-apk
        path: release

    - name: Download Windows EXE
      uses: actions/download-artifact@v4
      with:
        name: jarvis-windows-exe
        path: release

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: JARVIS v${{ github.run_number }}
        generate_release_notes: true
        files: |
          release/app-release.apk
          release/Jarvis.exe
